<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schaak</title>
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Schaak</h1>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>
    <main>
      <div id="game-container">
        <div id="game-info-panel">
          <div id="captured-black" class="captured-pieces"></div>
          <div id="game-status"></div>
          <div id="captured-white" class="captured-pieces"></div>
        </div>
        <div id="board-container">
          <div id="board"></div>
          <div id="eval-bar-container">
            <div id="eval-bar">
              <div id="eval-bar-fill"></div>
            </div>
            <span id="eval-text">0.0</span>
          </div>
        </div>
        <div id="side-panel">
          <div id="controls"></div>
          <div id="ai-stats" class="ai-stats hidden"></div>
          <div id="move-history"></div>
        </div>
      </div>
    </main>
    <div id="promotion-dialog" class="hidden"></div>
    <div id="settings-dialog" class="hidden">
      <div class="settings-overlay"></div>
      <div class="settings-content">
        <div class="settings-header">
          <h2>Settings</h2>
          <button id="settings-close" class="icon-btn" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="settings-body" id="settings-body"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
